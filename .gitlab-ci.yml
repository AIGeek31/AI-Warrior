# .gitlab-ci.yml for Python project with scikit-learn training and testing

stages:
  - test
  - train

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install -r requirements.txt

lint:
  stage: test
  script:
    - pip install flake8
    - flake8 .

train_model:
  stage: train
  script:
    - python train_error_classifier.py
  artifacts:
    paths:
      - my_classifier.pkl
      - my_vectorizer.pkl
    expire_in: 1 week
