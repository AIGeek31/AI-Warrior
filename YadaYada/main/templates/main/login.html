<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign In - Travel Agency</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1de9b6 0%, #1976d2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .signin-container {
            background: #e3f2fd;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(33,150,243,0.10);
            padding: 36px 28px 28px 28px;
            max-width: 350px;
            width: 100%;
            margin: 32px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .signin-container h2 {
            margin-bottom: 28px;
            color: #1976d2;
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .signin-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: stretch;
        }
        .signin-label {
            text-align: left;
            font-size: 1rem;
            color: #1976d2;
            margin-bottom: 4px;
            margin-top: 10px;
            font-weight: 500;
        }
        .signin-input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 0;
            border: 1px solid #b3e5fc;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            transition: border 0.2s;
            box-sizing: border-box;
        }
        .signin-input:focus {
            border: 1.5px solid #1976d2;
            outline: none;
        }
        .forgot-link {
            margin-top: 2px;
            margin-bottom: 18px;
            display: block;
            text-align: right;
            font-size: 0.92rem;
            color: #2196f3;
            text-decoration: none;
            transition: color 0.2s;
        }
        .forgot-link:hover {
            color: #1976d2;
            text-decoration: underline;
        }
        .signin-btn {
            width: 100%;
            background: #ff9800;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 12px 0;
            margin-top: 8px;
            cursor: pointer;
            transition: background 0.2s;
            letter-spacing: 1px;
        }
        .signin-btn:hover {
            background: #fb8c00;
        }
        @media (max-width: 500px) {
            .signin-container {
                padding: 24px 6vw 18px 6vw;
                max-width: 98vw;
            }
        }
    </style>
</head>
<body>
    <div class="signin-container">
        <h2>Sign In</h2>
        <form class="signin-form" method="post">
            {% csrf_token %}
            <label class="signin-label" for="email">Email</label>
            <input class="signin-input" type="email" id="email" name="email" placeholder="Email" required>
            <label class="signin-label" for="password">Password</label>
            <input class="signin-input" type="password" id="password" name="password" placeholder="Password" required>
            <a href="#" class="forgot-link">Forgot password?</a>
            <button class="signin-btn" type="submit">Sign in</button>
        </form>
        <form action="{% url 'register_page' %}" method="get" style="width:100%;margin-top:10px;">
            <button class="signin-btn" type="submit" style="background:#1976d2;">Register</button>
        </form>
    </div>
</body>
</html>
