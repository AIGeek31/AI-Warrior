<!DOCTYPE html>
<html lang="en">
<head>
    <title>Your Itinerary Options</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(180deg, #1de9b6 0%, #1976d2 100%);
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        .itinerary-container {
            background: #e3f2fd;
            border-radius: 22px;
            box-shadow: 0 4px 24px rgba(33,150,243,0.13);
            padding: 32px 24px 24px 24px;
            max-width: 420px;
            width: 100%;
            margin: 32px 12px 32px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .itinerary-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1976d2;
            margin-bottom: 18px;
            letter-spacing: 1.2px;
            text-align: center;
        }
        .itinerary-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 24px;
        }
        .itinerary-item {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(33,150,243,0.07);
            padding: 18px 16px 12px 16px;
            display: flex;
            flex-direction: column;
        }
        .itinerary-edit {
            width: 100%;
            border: none;
            background: #e3f2fd;
            color: #1976d2;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            margin-top: 8px;
            padding: 6px 0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .itinerary-edit:hover {
            background: #bbdefb;
        }
        .chat-container {
            width: 100%;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(33,150,243,0.07);
            padding: 16px 14px 10px 14px;
            margin-top: 10px;
        }
        .chat-title {
            color: #1976d2;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .chat-messages {
            min-height: 60px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.98rem;
            margin-bottom: 8px;
        }
        .chat-input-row {
            display: flex;
            gap: 8px;
        }
        .chat-input {
            flex: 1;
            border-radius: 6px;
            border: 1px solid #b3e5fc;
            padding: 8px 10px;
            font-size: 1rem;
        }
        .chat-send {
            background: #ff9800;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            padding: 8px 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-send:hover {
            background: #fb8c00;
        }
        @media (max-width: 600px) {
            .itinerary-container {
                padding: 18px 2vw 12px 2vw;
                max-width: 99vw;
            }
        }
    </style>
    <script>
        function editItinerary(idx) {
            const details = document.getElementById('details-' + idx);
            details.readOnly = false;
            details.focus();
        }
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const messages = document.getElementById('chat-messages');
            if (input.value.trim() !== '') {
                const msg = document.createElement('div');
                msg.textContent = 'You: ' + input.value;
                messages.appendChild(msg);
                input.value = '';
                messages.scrollTop = messages.scrollHeight;
            }
        }
    </script>
</head>
<body>
    <div class="itinerary-container">
        <div class="itinerary-title">Itinerary Options for {{ destination }}</div>
        <div class="itinerary-list">
            {% for item in itineraries %}
            <div class="itinerary-item">
                <strong>{{ item.title }}</strong>
                <textarea id="details-{{ forloop.counter0 }}" style="width:100%;margin-top:6px;border-radius:6px;border:1px solid #b3e5fc;padding:8px;resize:vertical;" rows="2" readonly>{{ item.details }}</textarea>
                <button class="itinerary-edit" type="button" onclick="editItinerary({{ forloop.counter0 }})">Edit</button>
            </div>
            {% endfor %}
        </div>
        <div class="chat-container">
            <div class="chat-title">Chat with our Specialist</div>
            <div class="chat-messages" id="chat-messages">
                <div>Welcome! Ask us anything about your trip.</div>
            </div>
            <div class="chat-input-row">
                <input class="chat-input" id="chat-input" type="text" placeholder="Type your message..." onkeydown="if(event.key==='Enter'){sendMessage();return false;}">
                <button class="chat-send" type="button" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
</body>
</html>
