<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register - Travel Agency</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1de9b6 0%, #1976d2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-container {
            background: #e3f2fd;
            border-radius: 20px;
            box-shadow: 0 4px 24px rgba(33,150,243,0.10);
            padding: 36px 28px 28px 28px;
            max-width: 350px;
            width: 100%;
            margin: 32px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .register-container h2 {
            margin-bottom: 28px;
            color: #1976d2;
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .register-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: stretch;
        }
        .register-label {
            text-align: left;
            font-size: 1rem;
            color: #1976d2;
            margin-bottom: 4px;
            margin-top: 10px;
            font-weight: 500;
        }
        .register-input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 0;
            border: 1px solid #b3e5fc;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            transition: border 0.2s;
            box-sizing: border-box;
        }
        .register-input:focus {
            border: 1.5px solid #1976d2;
            outline: none;
        }
        .register-btn {
            width: 100%;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 12px 0;
            margin-top: 8px;
            cursor: pointer;
            transition: background 0.2s;
            letter-spacing: 1px;
        }
        .register-btn:hover {
            background: #1565c0;
        }
        @media (max-width: 500px) {
            .register-container {
                padding: 24px 6vw 18px 6vw;
                max-width: 98vw;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Register</h2>
        {% if error %}
            <div style="color: red; margin-bottom: 10px;">{{ error }}</div>
        {% endif %}
        <form class="register-form" method="post">
            {% csrf_token %}
            <label class="register-label" for="email">Email</label>
            <input class="register-input" type="email" id="email" name="email" placeholder="Email" required>
            <label class="register-label" for="password">Password</label>
            <input class="register-input" type="password" id="password" name="password" placeholder="Password" required>
            <button class="register-btn" type="submit">Register</button>
        </form>
    </div>
</body>
</html>
